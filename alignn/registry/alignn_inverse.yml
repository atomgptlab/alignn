# ALIGNN generative inverse-design models (ALIGNN-CSP).
# Conditional diffusion over lattice + fractional coordinates with an
# ALIGNN denoiser; loaded through alignn.inverse.generate.ALIGNNGenerator.
# alignn2: ALIGNN 2.0 entries by category (alignn.pretrained.get_alignn2_model)
alignn2:
  generative:
    csp_supercon_jarvis:
      graph: dense
      cutoff: 0.0
      output_features: 0
      target: structure
      unit: ''
      conditioning:
      - composition
      - Tc_supercon
      match_rate: 0.4466
      rmsd: 0.0436
      figshare_article_id: 35079457
      url: https://ndownloader.figshare.com/files/71707198
      description: ALIGNN-CSP (line-graph, no angular objective) trained from scratch on AtomBench JARVIS Supercon-3D; 32-candidate workflow with ALIGNN-FF relaxation and crystallographic post-processing.
      training_data: https://ndownloader.figshare.com/files/38307921
    csp_supercon_alex:
      graph: dense
      cutoff: 0.0
      output_features: 0
      target: structure
      unit: ''
      conditioning:
      - composition
      - Tc
      match_rate: 0.5661
      rmsd: 0.0253
      figshare_article_id: 35079472
      url: https://ndownloader.figshare.com/files/71707204
      description: ALIGNN-CSP (line-graph, no angular objective) on AtomBench Alexandria DS-A/B superconductors, fine-tuned from csp_pretrain_dft3d; 32-candidate workflow with ALIGNN-FF relaxation and crystallographic post-processing.
      training_data: https://ndownloader.figshare.com/files/55551155
    csp_pretrain_dft3d:
      graph: dense
      cutoff: 0.0
      output_features: 0
      target: structure
      unit: ''
      conditioning:
      - composition
      figshare_article_id: 33315750
      url: https://ndownloader.figshare.com/files/67768734
      description: ALIGNN-CSP base model over 65k JARVIS dft_3d crystals with benchmark val/test ids held out; for fine-tuning.
      training_data: https://ndownloader.figshare.com/files/64391379
